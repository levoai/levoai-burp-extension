version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
      time: "04:00"
      timezone: Europe/Luxembourg
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "04:00"
      timezone: Europe/Luxembourg
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

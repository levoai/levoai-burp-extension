name: Build
env:
  JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2.3.4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@e6e38bacfdf1a337459f332974bb2327a31aaf4b

      - name: Run tests and build jar
        uses: gradle/gradle-build-action@v2
        with:
          arguments: test fatJar --no-daemon
        env:
          JAVA_OPTS: ${{ env.JAVA_OPTS }}

      - name: Verify Java 11 bytecode
        run: |
          CLASS_FILE=$(find build/classes -name '*.class' | head -1)
          MAJOR=$(file "$CLASS_FILE" | grep -oP 'version \K[0-9]+')
          echo "Found class: $CLASS_FILE with major version: $MAJOR"
          if [ "$MAJOR" != "55" ]; then
            echo "ERROR: Expected Java 11 bytecode (major 55), got $MAJOR"
            exit 1
          fi
          echo "Bytecode check passed: Java 11 (major 55)"

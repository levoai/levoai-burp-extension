name: Build
env:
  JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      # setup-gradle validates the Gradle wrapper checksums by default (validate-wrappers: true),
      # replacing the standalone gradle/wrapper-validation-action step.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run tests and build jar
        run: ./gradlew test fatJar --no-daemon
        env:
          JAVA_OPTS: ${{ env.JAVA_OPTS }}

      - name: Verify Java 11 bytecode
        run: |
          CLASS_FILE=$(find build/classes -name '*.class' | head -1)
          MAJOR=$(file "$CLASS_FILE" | grep -oP 'version \K[0-9]+')
          echo "Found class: $CLASS_FILE with major version: $MAJOR"
          if [ "$MAJOR" != "55" ]; then
            echo "ERROR: Expected Java 11 bytecode (major 55), got $MAJOR"
            exit 1
          fi
          echo "Bytecode check passed: Java 11 (major 55)"
